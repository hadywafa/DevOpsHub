<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1700" height="1340" fill="#F1F5F9"/>

  <!-- Title -->
  <text x="850" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">AWS EKS Platform — Reference Architecture</text>
  <text x="850" y="64" text-anchor="middle" font-size="14" fill="#475569">Terraform root: 6_aws-eks-platform · empty account → production-grade AI platform</text>

  <!-- Account boundary -->
  <rect x="40" y="90" width="1620" height="905" rx="16" fill="none" stroke="#EC7211" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="62" y="116" font-size="13" font-weight="700" fill="#EC7211" letter-spacing="1">AWS ACCOUNT · eu-north-1</text>
  <rect x="1420" y="98" width="220" height="30" rx="15" fill="#5B4EE5"/>
  <text x="1530" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">terraform apply</text>

  <!-- Outer wrapper (kept for visual symmetry with the Azure diagram) -->
  <rect x="65" y="140" width="1570" height="760" rx="14" fill="#FAFCFF" stroke="#EC7211" stroke-width="1.5"/>
  <text x="85" y="165" font-size="14" font-weight="700" fill="#EC7211">Region eu-north-1 · project ai71demo-dev</text>

  <!-- VPC -->
  <rect x="90" y="185" width="800" height="565" rx="12" fill="#F5F0FF" stroke="#8C4FFF" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="105" y="207" font-size="13" font-weight="700" fill="#6B21D6">VPC · vpc-ai71demo-dev · 10.30.0.0/16</text>

  <!-- Public subnets strip -->
  <rect x="110" y="222" width="760" height="110" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="125" y="242" font-size="12" font-weight="700" fill="#475569">Public Subnets (3 AZs) · IGW attached</text>

  <rect x="125" y="252" width="230" height="70" rx="6" fill="#F5F0FF" stroke="#8C4FFF"/>
  <text x="240" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#6B21D6">eu-north-1a</text>
  <text x="240" y="288" text-anchor="middle" font-size="10" fill="#475569">10.30.0.0/24</text>
  <text x="240" y="304" text-anchor="middle" font-size="10" fill="#475569">NAT Gateway (EIP)</text>

  <rect x="375" y="252" width="230" height="70" rx="6" fill="#F5F0FF" stroke="#8C4FFF"/>
  <text x="490" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#6B21D6">eu-north-1b</text>
  <text x="490" y="288" text-anchor="middle" font-size="10" fill="#475569">10.30.1.0/24</text>

  <rect x="625" y="252" width="230" height="70" rx="6" fill="#F5F0FF" stroke="#8C4FFF"/>
  <text x="740" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#6B21D6">eu-north-1c</text>
  <text x="740" y="288" text-anchor="middle" font-size="10" fill="#475569">10.30.2.0/24</text>

  <!-- Private subnets strip -->
  <rect x="110" y="345" width="760" height="378" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="125" y="365" font-size="12" font-weight="700" fill="#475569">Private Subnets (3 AZs) · 10.30.10-12.0/24 · egress via single NAT</text>

  <!-- EKS cluster -->
  <rect x="130" y="378" width="720" height="215" rx="10" fill="#FFF4E5" stroke="#FF9900" stroke-width="2"/>
  <rect x="130" y="378" width="720" height="34" rx="10" fill="#FF9900"/>
  <rect x="130" y="400" width="720" height="12" fill="#FF9900"/>
  <text x="146" y="400" font-size="14" font-weight="700" fill="#FFFFFF">EKS Cluster · eks-ai71demo-dev · v1.30</text>
  <text x="146" y="430" font-size="11" fill="#334155">OIDC provider for IRSA · control-plane logging: api, audit, authenticator</text>

  <rect x="150" y="444" width="330" height="135" rx="8" fill="#FFE8CC" stroke="#C2560C" stroke-width="1.5"/>
  <text x="165" y="464" font-size="13" font-weight="700" fill="#9A3412">System Node Group</text>
  <text x="165" y="482" font-size="11" fill="#1E293B">m6i.large</text>
  <text x="165" y="498" font-size="11" fill="#1E293B">desired 3 (min 2 / max 5)</text>
  <rect x="165" y="510" width="300" height="26" rx="5" fill="#FFFFFF" stroke="#C2560C"/>
  <text x="315" y="527" text-anchor="middle" font-size="9.5" fill="#9A3412">ingress-nginx / LB Controller / app pods</text>
  <text x="165" y="552" font-size="10" fill="#7C2D12">subnets: private (3 AZs)</text>

  <rect x="500" y="444" width="320" height="135" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="515" y="464" font-size="13" font-weight="700" fill="#9A3412">GPU Node Group (optional)</text>
  <text x="515" y="482" font-size="11" fill="#1E293B">g4dn.xlarge · AL2_x86_64_GPU</text>
  <text x="515" y="498" font-size="11" fill="#1E293B">taint: sku=gpu:NoSchedule</text>
  <rect x="515" y="510" width="290" height="26" rx="5" fill="#FFFFFF" stroke="#EA580C"/>
  <text x="660" y="527" text-anchor="middle" font-size="10" fill="#9A3412">model-serving inference pod</text>
  <text x="515" y="552" font-size="10" fill="#9A3412">scale 0 – 3 (scale-to-zero)</text>

  <!-- RDS -->
  <rect x="130" y="608" width="720" height="100" rx="8" fill="#EAF1FF" stroke="#527FFF" stroke-width="2"/>
  <text x="146" y="630" font-size="13" font-weight="700" fill="#1D3FCC">Amazon RDS for PostgreSQL</text>
  <text x="146" y="650" font-size="11" fill="#1E293B">ai71demo-dev-postgres · PostgreSQL 16 · db.t3.medium · Multi-AZ</text>
  <text x="146" y="668" font-size="11" fill="#1E293B">db_name: appdb · storage_encrypted = true · backup_retention_period = 7</text>
  <text x="146" y="686" font-size="11" fill="#1E293B">Security group allows TCP 5432 only from the EKS cluster security group</text>

  <!-- Notes box -->
  <rect x="110" y="738" width="760" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="4 3"/>
  <text x="125" y="758" font-size="12" font-weight="700" fill="#334155">Notes</text>
  <text x="125" y="776" font-size="11" fill="#475569">• Environment separation: one tfvars + one S3 backend key per env (dev/staging/prod), not one shared state file.</text>
  <text x="125" y="794" font-size="11" fill="#475569">• Drift: a security group rule added by hand in the console surfaces as a diff on the next `terraform plan`.</text>
  <text x="125" y="812" font-size="11" fill="#475569">• Import: `terraform import module.network.aws_vpc.this vpc-...` brings a hand-created VPC under management.</text>
  <text x="125" y="830" font-size="11" fill="#475569">• Gotcha: the CloudWatch log group is pre-created for retention control — EKS's implicit one never expires.</text>
  <text x="125" y="848" font-size="11" fill="#475569">• Single NAT gateway keeps the demo cheap; production would run one per AZ to avoid a cross-AZ single point of failure.</text>

  <!-- Right column -->
  <rect x="1030" y="185" width="580" height="55" rx="8" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
  <text x="1045" y="208" font-size="13" font-weight="700" fill="#1E293B">Internet / End Users</text>
  <text x="1045" y="226" font-size="10" fill="#475569">HTTPS requests to platform.example.com</text>

  <rect x="1030" y="260" width="580" height="85" rx="8" fill="#F5F0FF" stroke="#8C4FFF" stroke-width="1.5"/>
  <text x="1045" y="282" font-size="13" font-weight="700" fill="#6B21D6">Route 53 + ACM Certificate</text>
  <text x="1045" y="300" font-size="11" fill="#334155">platform.example.com (+ wildcard SAN)</text>
  <text x="1045" y="316" font-size="10" fill="#475569">DNS-validated · ALB created in-cluster by AWS Load Balancer Controller</text>
  <text x="1045" y="332" font-size="10" fill="#475569">module: dns_tls</text>

  <rect x="1030" y="365" width="580" height="90" rx="8" fill="#FCE8F3" stroke="#E7157B" stroke-width="1.5"/>
  <text x="1045" y="387" font-size="13" font-weight="700" fill="#9D174D">CloudWatch</text>
  <text x="1045" y="405" font-size="11" fill="#334155">/aws/eks/eks-ai71demo-dev/cluster · 30-day retention</text>
  <text x="1045" y="421" font-size="10" fill="#475569">control-plane logs: api, audit, authenticator</text>
  <text x="1045" y="437" font-size="10" fill="#475569">module: monitoring</text>

  <rect x="1030" y="475" width="580" height="90" rx="8" fill="#FFF1E0" stroke="#EC7211" stroke-width="1.5"/>
  <text x="1045" y="497" font-size="13" font-weight="700" fill="#9A3412">Elastic Container Registry</text>
  <text x="1045" y="515" font-size="11" fill="#334155">ai71demo-dev-app · IMMUTABLE tags · scan_on_push</text>
  <text x="1045" y="531" font-size="10" fill="#475569">pulled via node IAM role: AmazonEC2ContainerRegistryReadOnly</text>
  <text x="1045" y="547" font-size="10" fill="#475569">module: ecr</text>

  <rect x="1030" y="585" width="580" height="150" rx="8" fill="#FDECEA" stroke="#D13212" stroke-width="1.5"/>
  <text x="1045" y="607" font-size="13" font-weight="700" fill="#9B1C1C">Secrets Manager + IRSA</text>
  <text x="1045" y="625" font-size="11" fill="#334155">secret: ai71demo-dev/app-secrets</text>
  <text x="1045" y="641" font-size="10" fill="#475569">IAM Role: ai71demo-dev-external-secrets</text>
  <text x="1045" y="657" font-size="10" fill="#475569">trust: sts:AssumeRoleWithWebIdentity via EKS OIDC provider</text>
  <text x="1045" y="673" font-size="10" fill="#475569">subject: system:serviceaccount:apps:external-secrets</text>
  <text x="1045" y="689" font-size="10" fill="#475569">policy scoped to secretsmanager:GetSecretValue on this one secret ARN</text>
  <text x="1045" y="705" font-size="10" fill="#475569">module: security</text>

  <rect x="1030" y="755" width="580" height="90" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="1045" y="777" font-size="13" font-weight="700" fill="#334155">Terraform Remote State</text>
  <text x="1045" y="795" font-size="11" fill="#334155">S3 bucket + native lock (use_lockfile, TF ≥ 1.10)</text>
  <text x="1045" y="811" font-size="10" fill="#475569">key: aws-eks-platform.tfstate · backend "s3"</text>

  <!-- Arrows (all cross-column labels sit inside the 890-1030 gap, clear of both boxes) -->
  <line x1="1320" y1="240" x2="1320" y2="260" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="1280" y="243" width="80" height="16" fill="#F1F5F9"/>
  <text x="1320" y="255" text-anchor="middle" font-size="9" fill="#334155">HTTPS</text>

  <line x1="1030" y1="308" x2="850" y2="400" stroke="#6B21D6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="898" y="345" width="124" height="16" fill="#F1F5F9"/>
  <text x="960" y="357" text-anchor="middle" font-size="9.5" fill="#6B21D6">ALB (LB Controller)</text>

  <line x1="850" y1="430" x2="1030" y2="405" stroke="#E7157B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="898" y="408" width="124" height="16" fill="#F1F5F9"/>
  <text x="960" y="420" text-anchor="middle" font-size="9.5" fill="#9D174D">control-plane logs</text>

  <line x1="850" y1="460" x2="1030" y2="520" stroke="#EC7211" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="898" y="483" width="124" height="16" fill="#F1F5F9"/>
  <text x="960" y="495" text-anchor="middle" font-size="9.5" fill="#9A3412">ECR pull (node role)</text>

  <line x1="850" y1="500" x2="1030" y2="650" stroke="#D13212" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="898" y="565" width="124" height="16" fill="#F1F5F9"/>
  <text x="960" y="577" text-anchor="middle" font-size="9.5" fill="#9B1C1C">IRSA (OIDC)</text>

  <line x1="490" y1="593" x2="490" y2="608" stroke="#1D3FCC" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="400" y="591" width="180" height="16" fill="#F1F5F9"/>
  <text x="490" y="603" text-anchor="middle" font-size="9.5" fill="#1D3FCC">TCP 5432 (cluster SG only)</text>

  <!-- Legend -->
  <rect x="40" y="1010" width="470" height="120" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="55" y="1032" font-size="13" font-weight="700" fill="#1E293B">Legend</text>
  <line x1="55" y1="1052" x2="105" y2="1052" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="115" y="1056" font-size="11" fill="#334155">Network / data traffic</text>
  <line x1="55" y1="1078" x2="105" y2="1078" stroke="#D13212" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="115" y="1082" font-size="11" fill="#334155">Identity / IAM trust (IRSA, node role pulls)</text>
  <rect x="55" y="1096" width="50" height="14" fill="none" stroke="#EC7211" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="115" y="1107" font-size="11" fill="#334155">Terraform-managed boundary</text>

  <!-- Pipeline -->
  <text x="40" y="1175" font-size="15" font-weight="700" fill="#0F172A">Delivery Pipeline (GitOps)</text>

  <rect x="40" y="1195" width="240" height="100" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="160" y="1230" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">Developer</text>
  <text x="160" y="1250" text-anchor="middle" font-size="10" fill="#475569">git push</text>
  <text x="160" y="1266" text-anchor="middle" font-size="10" fill="#475569">feature branch → MR</text>

  <rect x="304" y="1195" width="240" height="100" rx="8" fill="#FFF1E8" stroke="#FC6D26" stroke-width="1.5"/>
  <text x="424" y="1230" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">GitLab CI/CD</text>
  <text x="424" y="1250" text-anchor="middle" font-size="10" fill="#7C2D12">build · test · scan</text>
  <text x="424" y="1266" text-anchor="middle" font-size="10" fill="#7C2D12">docker build</text>

  <rect x="568" y="1195" width="240" height="100" rx="8" fill="#FFF1E0" stroke="#EC7211" stroke-width="1.5"/>
  <text x="688" y="1230" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">Push image</text>
  <text x="688" y="1250" text-anchor="middle" font-size="10" fill="#7C2D12">Elastic Container Registry</text>
  <text x="688" y="1266" text-anchor="middle" font-size="10" fill="#7C2D12">immutable tag = git SHA</text>

  <rect x="832" y="1195" width="240" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="952" y="1230" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">Argo CD (in-cluster)</text>
  <text x="952" y="1250" text-anchor="middle" font-size="10" fill="#1E3A8A">pull-based reconciliation</text>
  <text x="952" y="1266" text-anchor="middle" font-size="10" fill="#1E3A8A">watches GitOps repo</text>

  <rect x="1096" y="1195" width="240" height="100" rx="8" fill="#FFF4E5" stroke="#FF9900" stroke-width="1.5"/>
  <text x="1216" y="1230" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">Helm chart render</text>
  <text x="1216" y="1250" text-anchor="middle" font-size="10" fill="#1E293B">values per environment</text>
  <text x="1216" y="1266" text-anchor="middle" font-size="10" fill="#1E293B">templated manifests</text>

  <rect x="1360" y="1195" width="300" height="100" rx="8" fill="#FFF4E5" stroke="#FF9900" stroke-width="2"/>
  <text x="1510" y="1230" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">EKS Deployment</text>
  <text x="1510" y="1250" text-anchor="middle" font-size="10" fill="#1E293B">rolling update, health checks</text>
  <text x="1510" y="1266" text-anchor="middle" font-size="10" fill="#1E293B">sync status visible in Argo CD UI</text>

  <line x1="280" y1="1245" x2="304" y2="1245" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="544" y1="1245" x2="568" y2="1245" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="808" y1="1245" x2="832" y2="1245" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1072" y1="1245" x2="1096" y2="1245" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1336" y1="1245" x2="1360" y2="1245" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="850" y="1325" text-anchor="middle" font-size="11" fill="#94A3B8">Everything inside the VPC/account boundary above is provisioned by terraform apply · pipeline stages run in GitLab + inside the EKS cluster</text>
</svg>
