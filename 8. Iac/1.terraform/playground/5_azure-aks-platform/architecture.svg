<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1700" height="1340" fill="#F1F5F9"/>

  <!-- Title -->
  <text x="850" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">Azure AKS Platform — Reference Architecture</text>
  <text x="850" y="64" text-anchor="middle" font-size="14" fill="#475569">Terraform root: 5_azure-aks-platform · empty subscription → production-grade AI platform</text>

  <!-- Subscription boundary -->
  <rect x="40" y="90" width="1620" height="905" rx="16" fill="none" stroke="#0078D4" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="62" y="116" font-size="13" font-weight="700" fill="#0078D4" letter-spacing="1">AZURE SUBSCRIPTION</text>
  <rect x="1420" y="98" width="220" height="30" rx="15" fill="#5B4EE5"/>
  <text x="1530" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">terraform apply</text>

  <!-- Resource Group -->
  <rect x="65" y="140" width="1570" height="760" rx="14" fill="#FAFCFF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="85" y="165" font-size="14" font-weight="700" fill="#0078D4">Resource Group · rg-ai71demo-dev (uaenorth)</text>

  <!-- VNet -->
  <rect x="90" y="185" width="800" height="565" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="105" y="207" font-size="13" font-weight="700" fill="#1D4ED8">Virtual Network · vnet-ai71demo-dev · 10.20.0.0/16</text>

  <!-- AKS subnet -->
  <rect x="110" y="222" width="760" height="330" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="125" y="242" font-size="12" font-weight="700" fill="#475569">Subnet snet-aks · 10.20.1.0/24 · NSG nsg-aks</text>

  <!-- AKS cluster -->
  <rect x="130" y="256" width="720" height="280" rx="10" fill="#EEF2FF" stroke="#326CE5" stroke-width="2"/>
  <rect x="130" y="256" width="720" height="34" rx="10" fill="#326CE5"/>
  <rect x="130" y="278" width="720" height="12" fill="#326CE5"/>
  <text x="146" y="278" font-size="14" font-weight="700" fill="#FFFFFF">AKS Cluster · aks-ai71demo-dev · v1.30</text>
  <text x="146" y="308" font-size="11" fill="#334155">OIDC issuer + Workload Identity · network_plugin=azure · network_policy=azure</text>

  <!-- System node pool -->
  <rect x="150" y="322" width="330" height="200" rx="8" fill="#DCE7FF" stroke="#4F6FE0" stroke-width="1.5"/>
  <text x="165" y="342" font-size="13" font-weight="700" fill="#1E3A8A">System Node Pool</text>
  <text x="165" y="360" font-size="11" fill="#1E293B">Standard_D4s_v5</text>
  <text x="165" y="376" font-size="11" fill="#1E293B">autoscale 2 – 5 nodes</text>
  <rect x="165" y="388" width="140" height="26" rx="5" fill="#FFFFFF" stroke="#4F6FE0"/>
  <text x="235" y="405" text-anchor="middle" font-size="10" fill="#1E3A8A">ingress-nginx</text>
  <rect x="315" y="388" width="140" height="26" rx="5" fill="#FFFFFF" stroke="#4F6FE0"/>
  <text x="385" y="405" text-anchor="middle" font-size="10" fill="#1E3A8A">cert-manager</text>
  <rect x="165" y="422" width="290" height="26" rx="5" fill="#FFFFFF" stroke="#4F6FE0"/>
  <text x="310" y="439" text-anchor="middle" font-size="10" fill="#1E3A8A">application workload pods</text>
  <text x="165" y="480" font-size="10" fill="#475569">enable_auto_scaling = true</text>
  <text x="165" y="496" font-size="10" fill="#475569">vnet_subnet_id = snet-aks</text>

  <!-- GPU node pool -->
  <rect x="500" y="322" width="320" height="200" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="515" y="342" font-size="13" font-weight="700" fill="#9A3412">GPU Node Pool (optional)</text>
  <text x="515" y="360" font-size="11" fill="#1E293B">Standard_NC4as_T4_v3</text>
  <text x="515" y="376" font-size="11" fill="#1E293B">taint: sku=gpu:NoSchedule</text>
  <text x="515" y="392" font-size="11" fill="#1E293B">autoscale 0 – 3 nodes</text>
  <rect x="515" y="404" width="290" height="26" rx="5" fill="#FFFFFF" stroke="#EA580C"/>
  <text x="660" y="421" text-anchor="middle" font-size="10" fill="#9A3412">model-serving inference pod</text>
  <text x="515" y="480" font-size="10" fill="#9A3412">gpu_node_pool_enabled = true</text>
  <text x="515" y="496" font-size="10" fill="#9A3412">node_labels: workload=model-serving</text>

  <!-- DB subnet -->
  <rect x="110" y="568" width="760" height="155" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="125" y="588" font-size="12" font-weight="700" fill="#475569">Subnet snet-db · 10.20.2.0/24 · delegated: Microsoft.DBforPostgreSQL/flexibleServers</text>

  <rect x="130" y="602" width="720" height="105" rx="8" fill="#E9FBF3" stroke="#059669" stroke-width="2"/>
  <text x="146" y="624" font-size="13" font-weight="700" fill="#065F46">Azure Database for PostgreSQL – Flexible Server</text>
  <text x="146" y="644" font-size="11" fill="#1E293B">psql-ai71demo-dev · PostgreSQL 16 · GP_Standard_D2s_v3 · database: appdb</text>
  <text x="146" y="662" font-size="11" fill="#1E293B">Private DNS zone linked · no public endpoint · zone-pinned (add high_availability for prod)</text>
  <text x="146" y="680" font-size="11" fill="#1E293B">backup_retention_days = 7</text>

  <!-- Notes box -->
  <rect x="110" y="738" width="760" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="4 3"/>
  <text x="125" y="758" font-size="12" font-weight="700" fill="#334155">Notes</text>
  <text x="125" y="776" font-size="11" fill="#475569">• Environment separation: one tfvars + one backend key per env (dev/staging/prod), not one shared state file.</text>
  <text x="125" y="794" font-size="11" fill="#475569">• Drift: manual changes via CLI/Portal (e.g. an NSG rule) surface as a diff on the next `terraform plan`.</text>
  <text x="125" y="812" font-size="11" fill="#475569">• Import: pre-existing resources are brought under management with `terraform import`, not recreated.</text>
  <text x="125" y="830" font-size="11" fill="#475569">• Gotcha: enable_rbac_authorization on Key Vault means the deployer identity needs a role too, or writes 403.</text>
  <text x="125" y="848" font-size="11" fill="#475569">• TLS is issued in-cluster (cert-manager), not by Terraform — this root only delegates the DNS zone.</text>

  <!-- Right column -->
  <rect x="1030" y="185" width="580" height="55" rx="8" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
  <text x="1045" y="208" font-size="13" font-weight="700" fill="#1E293B">Internet / End Users</text>
  <text x="1045" y="226" font-size="10" fill="#475569">HTTPS requests to platform.example.com</text>

  <rect x="1030" y="260" width="580" height="85" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
  <text x="1045" y="282" font-size="13" font-weight="700" fill="#1E293B">Azure DNS Zone</text>
  <text x="1045" y="300" font-size="11" fill="#334155">platform.example.com</text>
  <text x="1045" y="316" font-size="10" fill="#475569">NS delegated from registrar · records managed by ingress-nginx/cert-manager in-cluster</text>
  <text x="1045" y="332" font-size="10" fill="#475569">module: dns_tls</text>

  <rect x="1030" y="365" width="580" height="90" rx="8" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1045" y="387" font-size="13" font-weight="700" fill="#5B21B6">Log Analytics Workspace</text>
  <text x="1045" y="405" font-size="11" fill="#334155">log-ai71demo-dev · 30-day retention</text>
  <text x="1045" y="421" font-size="10" fill="#475569">Container Insights via oms_agent block on AKS</text>
  <text x="1045" y="437" font-size="10" fill="#475569">module: monitoring</text>

  <rect x="1030" y="475" width="580" height="90" rx="8" fill="#E6FFFB" stroke="#0EA5A4" stroke-width="1.5"/>
  <text x="1045" y="497" font-size="13" font-weight="700" fill="#0F766E">Azure Container Registry</text>
  <text x="1045" y="515" font-size="11" fill="#334155">acrai71demodev · Standard SKU</text>
  <text x="1045" y="531" font-size="10" fill="#475569">admin_enabled = false — pulled via kubelet managed identity (AcrPull)</text>
  <text x="1045" y="547" font-size="10" fill="#475569">module: acr</text>

  <rect x="1030" y="585" width="580" height="150" rx="8" fill="#FFF7E6" stroke="#D97706" stroke-width="1.5"/>
  <text x="1045" y="607" font-size="13" font-weight="700" fill="#92400E">Key Vault (RBAC-authorized)</text>
  <text x="1045" y="625" font-size="11" fill="#334155">kv-ai71demo-dev · sku standard</text>
  <text x="1045" y="641" font-size="10" fill="#475569">User-Assigned Identity: id-workload-ai71demo-dev</text>
  <text x="1045" y="657" font-size="10" fill="#475569">Federated Credential ↔ AKS OIDC issuer</text>
  <text x="1045" y="673" font-size="10" fill="#475569">subject: system:serviceaccount:apps:workload-identity-sa</text>
  <text x="1045" y="689" font-size="10" fill="#475569">secret: sample-app-secret · read via Secrets Store CSI / SDK</text>
  <text x="1045" y="705" font-size="10" fill="#475569">module: security</text>

  <rect x="1030" y="755" width="580" height="90" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="1045" y="777" font-size="13" font-weight="700" fill="#334155">Terraform Remote State</text>
  <text x="1045" y="795" font-size="11" fill="#334155">Storage Account (blob) + native lease lock</text>
  <text x="1045" y="811" font-size="10" fill="#475569">key: azure-aks-platform.tfstate · backend "azurerm"</text>

  <!-- Arrows (all cross-column labels sit inside the 890-1030 gap, clear of both boxes) -->
  <line x1="1320" y1="240" x2="1320" y2="260" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="1280" y="243" width="80" height="16" fill="#F1F5F9"/>
  <text x="1320" y="255" text-anchor="middle" font-size="9" fill="#334155">HTTPS</text>

  <line x1="1030" y1="305" x2="850" y2="292" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="898" y="288" width="124" height="16" fill="#F1F5F9"/>
  <text x="960" y="300" text-anchor="middle" font-size="9.5" fill="#334155">A/CNAME → Ingress</text>

  <line x1="850" y1="380" x2="1030" y2="405" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="898" y="383" width="124" height="16" fill="#F1F5F9"/>
  <text x="960" y="395" text-anchor="middle" font-size="9.5" fill="#5B21B6">Container Insights</text>

  <line x1="850" y1="440" x2="1030" y2="515" stroke="#0EA5A4" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="898" y="470" width="124" height="16" fill="#F1F5F9"/>
  <text x="960" y="482" text-anchor="middle" font-size="9.5" fill="#0F766E">AcrPull (mgd-id)</text>

  <line x1="850" y1="500" x2="1030" y2="650" stroke="#D97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="898" y="562" width="124" height="16" fill="#F1F5F9"/>
  <text x="960" y="574" text-anchor="middle" font-size="9.5" fill="#92400E">Workload Identity</text>

  <line x1="490" y1="536" x2="490" y2="602" stroke="#059669" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="400" y="558" width="180" height="16" fill="#F1F5F9"/>
  <text x="490" y="570" text-anchor="middle" font-size="9.5" fill="#065F46">TCP 5432 (private, VNet-internal)</text>

  <!-- Legend -->
  <rect x="40" y="1010" width="470" height="120" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="55" y="1032" font-size="13" font-weight="700" fill="#1E293B">Legend</text>
  <line x1="55" y1="1052" x2="105" y2="1052" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="115" y="1056" font-size="11" fill="#334155">Network / data traffic</text>
  <line x1="55" y1="1078" x2="105" y2="1078" stroke="#D97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="115" y="1082" font-size="11" fill="#334155">Identity / RBAC trust (OIDC federation, AcrPull)</text>
  <rect x="55" y="1096" width="50" height="14" fill="none" stroke="#0078D4" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="115" y="1107" font-size="11" fill="#334155">Terraform-managed boundary</text>

  <!-- Pipeline -->
  <text x="40" y="1175" font-size="15" font-weight="700" fill="#0F172A">Delivery Pipeline (GitOps)</text>

  <rect x="40" y="1195" width="240" height="100" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="160" y="1230" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">Developer</text>
  <text x="160" y="1250" text-anchor="middle" font-size="10" fill="#475569">git push</text>
  <text x="160" y="1266" text-anchor="middle" font-size="10" fill="#475569">feature branch → MR</text>

  <rect x="304" y="1195" width="240" height="100" rx="8" fill="#FFF1E8" stroke="#FC6D26" stroke-width="1.5"/>
  <text x="424" y="1230" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">GitLab CI/CD</text>
  <text x="424" y="1250" text-anchor="middle" font-size="10" fill="#7C2D12">build · test · scan</text>
  <text x="424" y="1266" text-anchor="middle" font-size="10" fill="#7C2D12">docker build</text>

  <rect x="568" y="1195" width="240" height="100" rx="8" fill="#E6FFFB" stroke="#0EA5A4" stroke-width="1.5"/>
  <text x="688" y="1230" text-anchor="middle" font-size="12" font-weight="700" fill="#0F766E">Push image</text>
  <text x="688" y="1250" text-anchor="middle" font-size="10" fill="#134E4A">Azure Container Registry</text>
  <text x="688" y="1266" text-anchor="middle" font-size="10" fill="#134E4A">immutable tag = git SHA</text>

  <rect x="832" y="1195" width="240" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="952" y="1230" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">Argo CD (in-cluster)</text>
  <text x="952" y="1250" text-anchor="middle" font-size="10" fill="#1E3A8A">pull-based reconciliation</text>
  <text x="952" y="1266" text-anchor="middle" font-size="10" fill="#1E3A8A">watches GitOps repo</text>

  <rect x="1096" y="1195" width="240" height="100" rx="8" fill="#EEF2FF" stroke="#326CE5" stroke-width="1.5"/>
  <text x="1216" y="1230" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">Helm chart render</text>
  <text x="1216" y="1250" text-anchor="middle" font-size="10" fill="#1E293B">values per environment</text>
  <text x="1216" y="1266" text-anchor="middle" font-size="10" fill="#1E293B">templated manifests</text>

  <rect x="1360" y="1195" width="300" height="100" rx="8" fill="#EEF2FF" stroke="#326CE5" stroke-width="2"/>
  <text x="1510" y="1230" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">AKS Deployment</text>
  <text x="1510" y="1250" text-anchor="middle" font-size="10" fill="#1E293B">rolling update, health checks</text>
  <text x="1510" y="1266" text-anchor="middle" font-size="10" fill="#1E293B">sync status visible in Argo CD UI</text>

  <line x1="280" y1="1245" x2="304" y2="1245" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="544" y1="1245" x2="568" y2="1245" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="808" y1="1245" x2="832" y2="1245" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1072" y1="1245" x2="1096" y2="1245" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1336" y1="1245" x2="1360" y2="1245" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="850" y="1325" text-anchor="middle" font-size="11" fill="#94A3B8">Everything inside the Resource Group boundary above is provisioned by terraform apply · pipeline stages run in GitLab + inside the AKS cluster</text>
</svg>
