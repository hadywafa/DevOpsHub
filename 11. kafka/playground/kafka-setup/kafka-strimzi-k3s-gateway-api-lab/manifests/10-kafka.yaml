apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: lab-kafka
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        deleteClaim: false
        kraftMetadata: shared
  resources:
    requests:
      cpu: 150m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 768Mi
  jvmOptions:
    -Xms: 384m
    -Xmx: 384m
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: lab-kafka
spec:
  kafka:
    version: 4.3.0
    metadataVersion: 4.3-IV0
    listeners:
      # Kafka remains cluster-internal. Gateway API exposes the HTTP services.
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      num.partitions: 3
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      auto.create.topics.enable: false
      unclean.leader.election.enable: false
      group.initial.rebalance.delay.ms: 0
      log.retention.hours: 168
  entityOperator:
    topicOperator: {}
