apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-client
  labels:
    app.kubernetes.io/name: kafka-client
    app.kubernetes.io/part-of: kafka-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-client
        app.kubernetes.io/part-of: kafka-lab
    spec:
      containers:
        - name: kafka-client
          image: quay.io/strimzi/kafka:1.1.0-kafka-4.3.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - sleep infinity
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
