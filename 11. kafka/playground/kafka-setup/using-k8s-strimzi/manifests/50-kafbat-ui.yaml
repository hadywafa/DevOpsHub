apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafbat-ui
  labels:
    app.kubernetes.io/name: kafbat-ui
    app.kubernetes.io/part-of: kafka-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafbat-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafbat-ui
        app.kubernetes.io/part-of: kafka-lab
    spec:
      containers:
        - name: kafbat-ui
          image: ghcr.io/kafbat/kafka-ui:v1.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: local-strimzi
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: lab-kafka-kafka-bootstrap:9092
            - name: KAFKA_CLUSTERS_0_SCHEMAREGISTRY
              value: http://schema-registry:8081
            - name: DYNAMIC_CONFIG_ENABLED
              value: "false"
            - name: SWAGGER_UI_ENABLED
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: -Xms128m -Xmx512m
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kafbat-ui
  labels:
    app.kubernetes.io/name: kafbat-ui
    app.kubernetes.io/part-of: kafka-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafbat-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
